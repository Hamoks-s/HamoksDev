<!DOCTYPE html>
<html lang="sk" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Čoskoro | Hamoks</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            min-height: 100vh;
            min-height: 100svh;
        }

        .coming-soon {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: calc(100vh - 110px);
            min-height: calc(100svh - 110px); /* 110px = margin-top of the footer, so text + gap = one screen */
            padding-top: 84px;
            text-align: center;
        }

        .coming-soon h1 {
            margin: 0;
            font-size: clamp(2.6rem, 9vw, 5.5rem);
            line-height: 1;
            letter-spacing: -0.05em;
        }

        .coming-soon p {
            margin: 18px 0 0;
            font-size: clamp(1.05rem, 2.4vw, 1.3rem);
            color: var(--color-text-muted);
        }

        .coming-soon-link {
            margin-top: 28px;
            color: var(--color-text-muted);
            transition: color 0.2s;
        }

        .coming-soon-link:hover {
            color: var(--color-accent);
        }

        @media (min-width: 700px) {
            .coming-soon {
                min-height: 0;
            }
        }
    </style>
    <link rel="icon" type="image/png" href="/images/logo/favicon_32.png">
</head>

<body>
    <header id="header"></header>
    <script src="/templates/header.js"></script>

    <dialog id="mobile-menu"></dialog>
    <script src="/templates/mobile-menu.js"></script>

    <main class="coming-soon">
        <div class="status is-live">
            <i class="status-dot"></i>Vo vývoji
        </div>
        <h1>Pracujem na tom</h1>
        <p>Táto stránka ešte nie je hotová.</p>
        <a class="coming-soon-link" href="/">← Späť domov</a>
    </main>

    <footer id="footer"></footer>
    <script src="/templates/footer.js"></script>

    <script src="/js/mobile-menu-function.js"></script>
    <script src="/js/utils.js"></script>
</body>
</html>
