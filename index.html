<!DOCTYPE html>
<html lang="sk" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hamoks</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/images/logo/favicon_32.png">
</head>

<body>
    <header id="header"></header>
    <script src="/templates/header.js"></script>

    <dialog id="mobile-menu"></dialog>
    <script src="/templates/mobile-menu.js"></script>

    <section id="hero">

        <div class="container">
            <h1><span class="title-mask"><span class="title-text"><span class="title-word">Tomáš</span> <span class="title-word">Jančúch</span></span></span></h1>
            <p class="hero-tagline is-typing" id="tagline" data-text="IT Študent | Full Stack Developer"><span class="tagline-typed">IT Študent | Full Stack Developer</span><span class="tagline-hidden"></span></p>
        </div>

        <a class="scroll-hint" href="#projects">
            <span class="scroll-hint-mouse"></span>
            <span class="scroll-hint-line"></span>
            <span class="scroll-hint-label">
                <b id="project-count">1 projekt</b>
                <svg class="icon"><use href="#icon-arrow"></use></svg>
            </span>
        </a>

    </section>

    <main>
        

        <section id="projects">
            <div class="section-heading">
                <h2>Projekty</h2>
            </div>
            <div class="project-grid">
                <a class="project-card" href="/projects/ssosza-kruzky.html">
                    <div>
                        <img class="project-image" src="images/ssosza-kruzky/ssosza-kruzky.png" alt="Screenshot of Ssosza kruzky">
                    </div>
                    
                    <div class="project-info">
                        <h3>SSOSZA Kruzky</h3>
                        <p class="project-subtext">Stránka na zaregistrovanie sa na školské krúžky.</p>
                        <p class="show-project">Ukázať Projekt <svg class="icon"><use href="#icon-arrow"></use></svg></p>
                        <div class="project-tags">
                            <span>Web</span>
                            <span>Node.js</span>
                            <span>MySQL</span>
                            
                        </div>
                    </div>
                </a>

            </div>
        </section>

        <section id="coming-next">
            <div class="section-heading">
                <h2>Čo príde ďalej</h2>
            </div>
            <div class="glow-panel">
                <div class="glow-panel-inner">

                    <div class="status-row" style="--progress: 10%">
                        <div>
                        <h3>3D Physics Engine</h3>
                        <p>C++ Aplikácia simulujúca fyziku realného sveta</p>
                        </div>
                        <div>
                        <div class="status is-live"><i class="status-dot"></i>Vo vývoji</div>
                        <div class="progress-bar"><b class="progress-fill"></b></div>
                        <span class="progress-percent">10 %</span>
                        </div>
                    </div>  

                </div>
            </div>
        </section>
    </main>
    
    <footer id="footer"></footer>
    <script src="/templates/footer.js"></script>
    <script src="/js/mobile-menu-function.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
